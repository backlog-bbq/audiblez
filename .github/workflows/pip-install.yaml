name: Installing via uv and running
run-name: uv sync and run
on: [ push, pull_request ]
jobs:
  uv-install-and-run:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install ffmpeg and espeak-ng
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libespeak-ng1
      - name: uv sync (with web extra)
        run: uv sync --extra web --python ${{ matrix.python-version }}
      - name: CLI smoke
        run: uv run --python ${{ matrix.python-version }} audiblez --help
      - name: Web app imports cleanly
        run: uv run --python ${{ matrix.python-version }} python -c "from audiblez import web, core; assert callable(core.synthesize)"

  windows-uv-install-and-run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install winget
        uses: Cyberboss/install-winget@v1
      - name: Install wingetcreate
        run: winget install wingetcreate --disable-interactivity --accept-source-agreements
      - name: Install ffmpeg
        run: winget install --id=Gyan.FFmpeg -e
      - name: Install espeak-ng
        run: winget install --id=eSpeak-NG.eSpeak-NG -e
      - name: uv sync
        run: uv sync --python 3.11
      - name: CLI smoke
        run: uv run --python 3.11 audiblez --help
